# ===================================================================
# FLYWAY
# ===================================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===================================================================
# JPA / HIBERNATE / FLYWAY
# ===================================================================

# O FLYWAY GERENCIA AS MIGRACOES DO BANCO
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ===================================================================
# SWAGGER / OPENAPI
# ===================================================================

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ===================================================================
# JWT
# ===================================================================

# Configure a variavel de ambiente JWT_SECRET antes de iniciar a API.
#jwt.secret=VerySecretChangeThisKeyForProductionWithMoreThan32Bytes123456
jwt.secret=Docker-K8S-Debian#2027!Ganhar)Muito_$$$!!!Loester-Lindo-TKD@@
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=2592000000

# ===================================================================
# ACTUATOR / HEALTH CHECK
# ===================================================================

# GET http://localhost:8080/actuator/health

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===================================================================
# INTERNACIONALIZACAO / VALIDACAO
# ===================================================================

# Arquivos messages.properties e messages_pt_BR.properties
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===================================================================
# TIMEZONE E CODIFICACAO
# ===================================================================

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================================================================
# TRATAMENTO DE ERROS - DESENVOLVIMENTO
# ===================================================================

server.error.include-message=always

# ===================================================================
# LOGGING
# ===================================================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Descomente se precisar investigar problemas HTTP ou Swagger:
#logging.level.org.springframework.web=DEBUG
#logging.level.org.springdoc=DEBUG