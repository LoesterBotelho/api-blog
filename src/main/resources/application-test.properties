
# ==========================================================
# PERFIL DE TESTE
# ==========================================================

# ==========================================================
# SERVER
# ==========================================================
server.port=0

# ==========================================================
# H2 DATABASE
# ==========================================================
spring.datasource.url=jdbc:h2:mem:library_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

# ==========================================================
# JPA / HIBERNATE
# ==========================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================================
# FLYWAY
# ==========================================================
spring.flyway.enabled=false

# ==========================================================
# SQL INITIALIZATION
# ==========================================================
# Desativado porque o Hibernate criará as tabelas.
# Ative somente se os scripts forem necessários.
spring.sql.init.mode=never

# ==========================================================
# SWAGGER / OPENAPI
# ==========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==========================================================
# JWT - TESTES
# ==========================================================
jwt.secret=Docker-K8S-Debian#2027!Ganhar)Muito_$$$!!!Loester-Lindo-TKD@@
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=2592000000

# ==========================================================
# ERROR DETAILS
# ==========================================================
server.error.include-stacktrace=never

# ==========================================================
# LOGGING
# ==========================================================
logging.level.org.springframework.web=WARN
logging.level.org.springdoc=WARN
