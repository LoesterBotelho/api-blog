# ==========================================================
# PERFIL DE TESTE
# ==========================================================

# ==========================================================
# SERVER
# ==========================================================
server.port=0

# ==========================================================
# H2 DATABASE
# ==========================================================
spring.datasource.url=jdbc:h2:mem:library_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

# ==========================================================
# JPA / HIBERNATE
# ==========================================================
# O Flyway gerencia a estrutura; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================================
# FLYWAY
# ==========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true


# desativado , usando flyway
# ==========================================================
# SQL Initialization
# ==========================================================
#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:init.sql
#spring.sql.init.data-locations=classpath:inserts.sql

# ==========================================================
# SQL INITIALIZATION
# ==========================================================
# Os dados de teste serão preparados individualmente com @Sql
# ou pelos próprios testes.
spring.sql.init.mode=never

# ==========================================================
# SWAGGER / OPENAPI
# ==========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==========================================================
# JWT - TESTES
# ==========================================================
#jwt.secret=VerySecretChangeThisKeyForProductionWithMoreThan32Bytes123456
jwt.secret=Docker-K8S-Debian#2027!Ganhar)Muito_$$$!!!Loester-Lindo-TKD@@
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=2592000000

# ==========================================================
# ERROR DETAILS
# ==========================================================
server.error.include-stacktrace=never

# ==========================================================
# LOGGING
# ==========================================================
logging.level.org.springframework.web=WARN
logging.level.org.springdoc=WARN